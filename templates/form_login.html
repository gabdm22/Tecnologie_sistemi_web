<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi al tuo account MoVA</title>
    <link rel="stylesheet" href="/static/style_form_login.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <SCRIPT src="/static/svuota_form.js" defer></SCRIPT>    <!-- script per svuotare il campo password quando si torna alla pagina -->
    <SCRIPT src="/static/controllo_password.js" defer></SCRIPT>    <!-- script per controllo requisiti password -->
</head>
<body>
    <div class="login-container">
        
        <div class="FORM">          
            <h1 id="titolo-login">LOGIN</h1> 
             <div id="error-box" class="alert-error"></div>
            <form id="login-form" autocomplete="off">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <div class = "password-wrapper">
                    <input type="password" id="password" name="password" >
                    <span class="toggle-password" onclick="toggleVisibility('password', this)">
                        <img src="/static/occhio.svg" alt="Mostra/Nascondi" width="20">
                    </span>
                </div>  
                <button id="login-btn" type="submit">Login</button>
            </form>

            <div class="register-link"> 
                <h5 class="divider-text">Sei nuovo su MOVA?</h5>
                <a href="form_registrazione.html" class="btn-mova">Crea il tuo account MOVA</a>
            </div>
        </div>

        <footer>
            <p>&copy;2026 MoVA - Museum of Virtual Art. Created by Nicolò Carbone and Gabriele Di Martino</p>
        </footer>

    </div>

    <script src="/static/controllo_utente.js"></script>
</body>
</html>
